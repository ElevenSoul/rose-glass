<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 4 36 39">
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b3c7"/>
      <stop offset="1" stop-color="#b0607e"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d58aa4"/>
      <stop offset="1" stop-color="#8a4664"/>
    </linearGradient>
    <radialGradient id="bud" cx=".5" cy=".35" r=".7">
      <stop offset="0" stop-color="#c97391"/>
      <stop offset="1" stop-color="#7d3b58"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3c8ac"/>
      <stop offset="1" stop-color="#4f7d63"/>
    </linearGradient>
  </defs>
  <!-- stem + leaves -->
  <path d="M24 30c0 4-.4 7.4.6 11" stroke="#5f8a6e" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M24.3 37c-1.1-4-4.9-6.3-9-6 .9 3.9 4.6 6.7 9 6z" fill="url(#leaf)"/>
  <path d="M24.5 34.6c1.4-3.3 4.9-4.9 8.4-4.2-1.2 3.3-4.7 5-8.4 4.2z" fill="url(#leaf)"/>
  <!-- back petals: run down behind the cup so no background shows through -->
  <path d="M12 17.5c1.4-6.4 6.3-10.6 12-10.6s10.6 4.2 12 10.6L35 24H13z" fill="url(#back)"/>
  <!-- the bud -->
  <path d="M16.8 17c.6-5 3.6-8 7.2-8s6.6 3 7.2 8c-2.2 2-4.6 3-7.2 3s-5-1-7.2-3z" fill="url(#bud)"/>
  <!-- inner folded petal -->
  <path d="M19.2 16.3c.9-3 2.7-4.7 4.8-4.7s3.9 1.7 4.8 4.7c-1.5 1-3.1 1.5-4.8 1.5s-3.3-.5-4.8-1.5z" fill="#b5617f"/>
  <path d="M21.6 14.6c.6-1.3 1.4-2 2.4-2" stroke="#f7c9d7" stroke-opacity=".6" stroke-width=".8" stroke-linecap="round" fill="none"/>
  <!-- front cup -->
  <path d="M11 16.5c0 9.4 5.6 15.2 13 15.2S37 25.9 37 16.5c-3.6 3.1-8.2 4.7-13 4.7s-9.4-1.6-13-4.7z" fill="url(#petal)"/>
  <!-- wrapped side petals -->
  <path d="M11 16.5c2.7 2.3 5.8 3.7 9.3 4.3-1.5 4.7-.5 8.6 2.4 10.9C15.6 30.9 11 25 11 16.5z" fill="#dc94ad"/>
  <path d="M37 16.5c-2.7 2.3-5.8 3.7-9.3 4.3 1.5 4.7.5 8.6-2.4 10.9C32.4 30.9 37 25 37 16.5z" fill="#c4708f"/>
  <!-- soft highlight -->
  <path d="M14.4 20.8c1.5 3.3 4 5.7 7.3 6.7" stroke="#fff" stroke-opacity=".38" stroke-width=".9" stroke-linecap="round" fill="none"/>
</svg>
